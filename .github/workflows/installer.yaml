name: Installer integration

on:
  push:
    branches:
      - main
    paths:
      - "install.sh"
      - ".github/workflows/installer.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "install.sh"
      - ".github/workflows/installer.yaml"

# Cancel in-progress runs for pull requests when developers push
# additional changes, and serialize builds in branches.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-concurrency-to-cancel-any-in-progress-job-or-run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ubuntu:
    name: Test installer on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Test Debian package install plan
        run: |
          output=$(VERSION=0.0.0 DISTRO=debian OS=linux ARCH=amd64 ./install.sh --dry-run)
          grep -F "https://github.com/hempflower/vscode-agents-server/releases/download/v0.0.0/code-server_0.0.0_amd64.deb" <<<"$output"
          grep -F "vscode-agents-server@\$USER" <<<"$output"

  alpine:
    name: Test installer on Alpine
    runs-on: ubuntu-latest
    container: "alpine:3.17"
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Test unsupported platform error
        run: |
          if output=$(VERSION=0.0.0 DISTRO=alpine OS=linux ARCH=amd64 ./install.sh --dry-run 2>&1); then
            exit 1
          fi
          echo "$output" | grep -F "There are no vscode-agents-server builds for alpine."

  macos:
    name: Test installer on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Test standalone install plan
        run: |
          output=$(VERSION=0.0.0 DISTRO=macos OS=macos ARCH=arm64 ./install.sh --dry-run --method standalone)
          grep -F "https://github.com/hempflower/vscode-agents-server/releases/download/v0.0.0/code-server-0.0.0-macos-arm64.tar.gz" <<<"$output"
          grep -F "/bin/vscode-agents-server" <<<"$output"
